# Development override with live reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    environment:
      APP_ENV: development
    volumes:
      - ./backend/src:/app/src:ro
      - ./static:/app/static
    command: ["uvicorn", "src.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
