name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, architecture, contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest (unit + integration)
        run: >
          pytest -q --junitxml=reports/pytest.xml
          --ignore=tests/test_architecture.py
          --ignore=tests/test_openapi_contract.py
          --ignore=tests/test_openapi_snapshot.py

      - name: Architecture rules
        run: pytest -q tests/test_architecture.py

      - name: OpenAPI contract
        run: pytest -q tests/test_openapi_contract.py tests/test_openapi_snapshot.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/reports/pytest.xml

  docker:
    name: Docker build and container smoke test
    runs-on: ubuntu-latest
    needs: quality
    env:
      HOST_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build image
        run: docker compose build

      - name: Start container
        run: docker compose up -d

      - name: Smoke test
        run: python backend/scripts/smoke_test.py --base-url http://127.0.0.1:8000 --write-state /tmp/smoke.json

      - name: Runs as non-root
        run: test "$(docker compose exec -T backend id -u)" != "0"

      - name: Data survives a restart
        run: |
          docker compose restart backend
          python backend/scripts/smoke_test.py --base-url http://127.0.0.1:8000 --check-state /tmp/smoke.json

      - name: Docker reports healthy
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)")
            echo "health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down -v
